<script>
const NOTES=[
{l:1,t:"What is a database?",en:["An organized collection of data used to model an organization, activity or process.","Key ideas: organized data + defined purpose + model of real-world activity.","Flow: real-world activity → data collection → organization → storage → information use."],ar:"قاعدة البيانات = بيانات منظمة لغرض محدد وتمثل نشاط حقيقي."},
{l:1,t:"Operational vs. analytical databases ⭐",en:["Operational: OLTP, daily transactions, data is dynamic (changes often). Examples: retail, hospitals, manufacturing. Question: What is happening now?","Analytical: OLAP, historical analysis, data is static or rarely changed. Used for trends, statistics, projections. Question: What happened over time?","Analytical databases often draw data from operational sources. This course focuses on operational databases."],ar:"التشغيلية (OLTP) للمعاملات اليومية وبياناتها تتغير. التحليلية (OLAP) للتاريخ والقرارات وبياناتها ثابتة تقريباً. مثال: تسجيل الطلاب اليوم = تشغيلية."},
{l:1,t:"The relational model: history",en:["Conceived in 1969; Dr. Edgar F. Codd presented the relational model in 1970.","Based on set theory and first-order predicate logic.","Solved redundancy, weak integrity and dependence on physical storage.","The term relation comes from set theory, not just from tables being related."],ar:"كود (Codd) هو صاحب النموذج العلائقي سنة 1970. كلمة relation جاية من نظرية المجموعات مو من ربط الجداول."},
{l:1,t:"Table, record, field + characteristics of a relation",en:["Relation = Table. Tuple = Record (row). Attribute = Field (column).","Records are identified by a field with a unique value.","Order of records and order of fields is NOT important.","Users do not need to know where a record is physically stored.","These support logical independence."],ar:"ترتيب الصفوف والأعمدة ما يهم، وكل سجل له قيمة فريدة تعرّفه."},
{l:1,t:"Relationships: PK → FK",en:["Relationships connect tables through matching values in a shared field.","Primary Key (in the parent table) → Foreign Key (in the child table) creates the logical connection.","Example: CUSTOMERS (PK CustomerID) 1:N ORDERS (FK CustomerID): one customer can place many orders.","Three types: 1:1, 1:N, M:N."],ar:"المفتاح الرئيسي في الجدول الأول والمفتاح الأجنبي في الثاني. العميل الواحد له طلبات كثيرة = 1:N."},
{l:1,t:"Advantages of relational databases, RDBMS & SQL",en:["Advantages: built-in multilevel integrity; logical and physical data independence; consistency and accuracy; easy retrieval from one or related tables.","Early relational software seemed slow because of limited technology (not the model); hardware and software then improved.","RDBMS = software to create, maintain, manipulate and retrieve relational data and support user applications.","SQL is used to retrieve and work with relational data.","Examples: IBM DB2, Microsoft Access, SQL Server, MySQL, Oracle, PostgreSQL, SQLite."],ar:"RDBMS هو البرنامج اللي ندير فيه القاعدة، وSQL هي اللغة اللي نسأل فيها."},
{l:2,t:"Big idea: design before building",en:["Good design starts BEFORE tables are created in the RDBMS.","Logical design (blueprint) → Physical implementation (building).","Database design = defining a structure that supports the organization’s information and operational needs."],ar:"التصميم المنطقي (الخريطة) يجي قبل التنفيذ الفعلي في البرنامج. لا تبني قبل ما ترسم."},
{l:2,t:"Consequences of improper design (4)",en:["1. Difficult information retrieval","2. Inaccurate results","3. Redundant data (same fact stored repeatedly)","4. Data anomalies (insert, update, delete problems)"],ar:"التصميم الضعيف = صعوبة جلب المعلومات + نتائج غلط + تكرار بيانات + مشاكل عند الإضافة والتعديل والحذف."},
{l:2,t:"Anomalies (STUDENT_COURSE example)",en:["Update anomaly: changing an instructor means editing many rows.","Insert anomaly: hard to add a course before anyone enrolls.","Delete anomaly: deleting the last enrollment may lose the course data.","Fix: separate tables STUDENTS, COURSES, ENROLLMENTS."],ar:"لما نخلط الطالب والمادة والدكتور في جدول واحد تتكرر الأسماء. الحل: نفصلهم في 3 جداول."},
{l:2,t:"Theory behind the relational model",en:["Relational model = founded on mathematical theory.","Set theory: organizing and operating on relations.","First-order predicate logic: logical interpretation and retrieval of data.","Theory stays valid regardless of the RDBMS product."],ar:"النظرية: نظرية المجموعات + المنطق الرياضي. تنفع مع أي برنامج قاعدة بيانات."},
{l:2,t:"Why learn a design methodology (5)",en:["Organized step-by-step process","Informed design decisions","Reduces rework and errors","Saves time and effort (no trial-and-error)","Improves use of RDBMS tools","It prevents: redundant, duplicate, and inconsistent data."],ar:"المنهجية تخليك منظم، تقلل الأخطاء، توفر وقت، وتمنع التكرار والتناقض."},
{l:2,t:"THE 5 OBJECTIVES of good design ⭐",en:["1. Information retrieval: supports required info (known at requirements gathering) AND ad hoc info (unexpected requests after implementation).","2. Proper tables: single subject, distinct fields, minimal redundancy, clear identification (key).","3. Data integrity: field-level, table-level, relationship-level, business rules.","4. Business rules: statements that define or constrain the organization’s operations (e.g. max credit hours).","5. Future growth: reasonable adaptability, not predicting everything."],ar:"أهم نقطة بالمحاضرة! الخمسة: جلب المعلومات، جداول صحيحة، سلامة البيانات، قواعد العمل، النمو المستقبلي."},
{l:2,t:"Ideal table & 4 types of integrity",en:["Ideal table = one subject + well-defined fields + appropriate key + minimal duplication.","Field-level: validity of individual field values.","Table-level: records identified properly (keys).","Relationship-level: valid links between tables.","Business rules: organization-specific restrictions."],ar:"الجدول المثالي: موضوع واحد، حقول واضحة، مفتاح، وبدون تكرار. أنواع السلامة 4: حقل، جدول، علاقة، قواعد عمل."},
{l:2,t:"Traditional vs. book’s method",en:["Traditional: Requirements analysis → Data modeling → Normalization.","Book’s sequence: Tables → Fields → Keys → Relationships → Rules → Views → Integrity.","Normalization is used to validate and refine table structures."],ar:"الطريقة التقليدية 3 خطوات، وطريقة الكتاب 7 خطوات. التطبيع (Normalization) نستخدمه نتأكد ونحسّن الجداول."},
{l:2,t:"Benefits of good design",en:["Structure is easy to modify and maintain","Data is easy to modify (integrity controls)","Information is easy to retrieve","Applications are easy to develop and build","Result: lower maintenance risk, trustworthy data, longer database life."],ar:"فوائد: سهولة التعديل، سهولة جلب المعلومات، بيانات موثوقة، وعمر أطول للقاعدة."},

{l:3,t:"Value-related terms: data, information, Null ⭐",en:["Data: the values you store (e.g. StudentID 202601, Credits 72). Static until modified.","Information: data processed so it is meaningful and useful (individual sales → monthly total).","Null: a missing or unknown value. It is NOT zero and NOT blank text.","0 = known number; empty text = known empty value; NULL = no usable value.","Problems with Null: complicates comparisons and calculations, unclear meaning, and too many Nulls signal a weak table."],ar:"البيانات = قيم مخزنة. المعلومات = بيانات معالجة ومفيدة. Null = قيمة ناقصة أو مجهولة، مو صفر ومو فراغ."},
{l:3,t:"Structure-related terms: table, field, record, view",en:["Table: data stored in relations, perceived by users as tables.","Field = column/attribute. Record = row/tuple.","View: a virtual table made of fields from one or more base tables; it does not need to store a separate copy of the data."],ar:"الـ View جدول افتراضي مبني من جداول أساسية (base tables) ولا يخزّن نسخة جديدة."},
{l:3,t:"Keys & index ⭐",en:["Key: a field or set of fields that identifies records or establishes relationships.","Primary key: uniquely identifies each record.","Candidate key: qualifies to be the primary key.","Alternate key: a candidate key NOT chosen as primary.","Foreign key: references a primary key in another table.","Index: a structure the RDBMS provides to improve data processing and retrieval. Do not confuse it with a key."],ar:"المفتاح يعرّف السجل ويربط الجداول، أما الفهرس (Index) فيسرّع البحث فقط. المرشح اللي ما انختار = بديل (Alternate)."},
{l:3,t:"Relationship-related terms",en:["Relationship: records of one table can be associated with records of another.","Types: 1:1, 1:N, M:N.","Type of participation: mandatory or optional.","Degree of participation: minimum and maximum number of related records (e.g. 0..1, 1..1, 0..M, 1..M).","These come from organizational requirements, not guesses."],ar:"النوع (1:1 / 1:N / M:N)، ونوع المشاركة (إجباري أو اختياري)، ودرجة المشاركة (الحد الأدنى والأعلى)."},
{l:3,t:"Integrity-related terms ⭐",en:["Field specification: a complete definition of a field and the values it can hold: identity (name, purpose), physical (data type, length, format), logical (required value, range, defaults, rules).","Field specifications establish field-level integrity.","Data integrity: the validity, consistency and accuracy of the data. Design it in from the start.","Four types: field-level, table-level, relationship-level, business rules."],ar:"مواصفات الحقل = تعريف كامل للحقل (هوية، فيزيائي، منطقي). سلامة البيانات = صحة وتناسق ودقة، وتنقسم لأربعة أنواع."},
{l:4,t:"THE 7 PHASES ⭐ (memorize the order)",en:["1 Mission → 2 Analyze → 3 Structures → 4 Relationships → 5 Rules → 6 Views → 7 Integrity","Each phase builds on decisions from the previous phase.","Methodology works for: a NEW database, REFINING an existing one, or ANALYZING before REDESIGN."],ar:"سبع مراحل مرتبة، كل مرحلة تبني على اللي قبلها. تنفع للجديدة وللقديمة وقبل إعادة التصميم. (شوفي حيلة الحفظ تحت)",mn:1},
{l:4,t:"Why complete the entire process?",en:["Follow it from beginning to end, whatever the database type, size or purpose.","More thorough = lower risk of inconsistent data and inaccurate information.","Key principle: an incomplete design is a poor design. No shortcuts, even if it looks simple."],ar:"لازم تكملين كل المراحل حتى لو القاعدة بسيطة. نص تصميم = تصميم ضعيف."},
{l:4,t:"Phase 1: Mission statement & objectives",en:["Mission statement: establishes the PURPOSE of the database and gives a focus. Team: developer + database owner + management.","Mission objectives: general TASKS users can perform on the data. Team: developer + management + end users.","Example: mission = maintain accurate student registration data. Objectives = track students/courses, record registrations, produce class lists."],ar:"البيان (Statement) = ليش القاعدة موجودة. الأهداف (Objectives) = إيش المستخدم يسوي فيها. الفرق بالفريق: الأهداف فيها المستخدمين."},
{l:4,t:"Phase 2: Analyzing the current database",en:["Sources: existing (legacy or paper) database; collection & presentation of data (forms, reports, applications, web); interviews with users and management.","Output: initial field list → remove calculated fields → refined list of fundamental data requirements."],ar:"نحلل الوضع الحالي: قاعدة قديمة، نماذج وتقارير، ومقابلات. الناتج: قائمة حقول بدون الحقول المحسوبة."},
{l:4,t:"Phase 3: Creating the data structures",en:["Tables: identify subjects from objectives and requirements.","Fields: associate fields; remove multipart / multivalued / misplaced fields.","Keys: choose a primary key for each table.","Field specifications: define data type, length, required value, Null, etc.","Quality check: each table = one subject; fields = distinct characteristics."],ar:"جداول ← حقول ← مفاتيح ← مواصفات الحقول. كل جدول موضوع واحد."},
{l:4,t:"Phase 4: Table relationships",en:["1 Identify logical relationships (with users/management)","2 Establish: connect tables with primary/foreign keys or a linking table","3 Characterize: set the type and degree of participation","4 Protect: relationship-level integrity","Example: STUDENTS (StudentID PK) → ENROLLMENTS (StudentID FK)."],ar:"حدد، اربط (PK/FK أو جدول وسيط)، وصّف النوع والمشاركة، واحمِ العلاقة."},
{l:4,t:"Phase 5: Business rules",en:["Business rules = limitations and requirements on data, structures or relationships, based on how the organization uses its data.","User-level example: Ship Date must be later than Order Date.","Management example: an agent can represent no more than 20 entertainers.","Validation tables: when a field has a finite set/range of allowed values."],ar:"قواعد العمل = قيود حسب سياسة المؤسسة. جداول التحقق نستخدمها لما القيم المسموحة محدودة."},
{l:4,t:"Phase 6: Views",en:["Identify needs (interview users and management).","Define the view: choose tables and fields.","Set criteria to limit the records returned (e.g. State = Texas).","Detailed view: operational users, daily work.","Summary view: management, strategic decisions."],ar:"الـ View هو عرض مخصص من الجداول. تفصيلي للموظفين، ملخص للإدارة."},
{l:4,t:"Phase 7: Reviewing data integrity",en:["Four areas checked: table-level, field-level, relationship-level, business rules.","Then the logical design is complete and ready for RDBMS implementation."],ar:"المراجعة الأخيرة 4 مجالات: الجدول، الحقل، العلاقة، قواعد العمل. بعدها ننفذ في البرنامج."},
{l:4,t:"Notes for designers",en:["No shortcuts: partial design is almost as risky as none.","People matter: users and management repeatedly give requirements.","Logical first: finish logical design before the RDBMS.","Iterative: the process is never truly finished; it evolves with the organization."],ar:"لا اختصارات، الناس مهمين، المنطقي أول، والتصميم يتطور دايم."}
];

const Q=[
[1,"Which database supports OLTP and daily changing data?",["Analytical","Operational","Historical archive","Static"],1,"التشغيلية = OLTP وبيانات ديناميكية."],
[1,"A university database updated all day with current registrations is…",["Analytical (OLAP)","Operational (OLTP)","Neither","A view"],1,"تحديث طول اليوم = تشغيلية OLTP."],

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let lec="all",tab="notes";
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const flt=a=>a.filter(x=>lec=="all"||(x.l||x[0])==lec);

function notes(){
 $("#notes").innerHTML=flt(NOTES).map(n=>`<details class="card"${n.mn?" open":""}><summary>L${n.l} · ${esc(n.t)}</summary><div class="b"><ul>${n.en.map(e=>`<li>${esc(e)}</li>`).join("")}</ul><div class="ar">${esc(n.ar)}</div>${n.mn?`<div class="card hero"><b>Memory trick:</b> <b>M</b>y <b>A</b>unt <b>S</b>ells <b>R</b>ice, <b>R</b>ed <b>V</b>egetables, <b>I</b>ce<br><span class="tag">Mission · Analyze · Structures · Relationships · Rules · Views · Integrity</span><div class="ar">عمتي تبيع رز وخضار وثلج: أول حرف من كل كلمة هو أول حرف من المرحلة.</div></div>`:""}</div></details>`).join("");
}
let ci=0,deck=[],flip=false;
function cards(reset){
 if(reset){deck=sh(flt(CARDS));ci=0;flip=false}
 const c=deck[ci];
 $("#cards").innerHTML=`<div class="row"><span class="tag">${ci+1} / ${deck.length}</span><button id="shuf">Shuffle</button></div><div class="bar"><i style="width:${(ci+1)/deck.length*100}%"></i></div>
 <div class="card fc ${flip?"back":""}" id="fc" tabindex="0" role="button" aria-label="Flip card">${flip?`<div>${esc(c[2])}</div><div class="ar" style="margin-top:10px">${esc(c[3])}</div>`:`<div>${esc(c[1])}</div>`}<small>${flip?"Tap to see the question":"Tap to flip (try answering first!)"} · Lecture ${c[0]}</small></div>
 <div class="row"><button id="pv">← Previous</button><button id="nx">Next →</button></div>`;
 const f=()=>{flip=!flip;cards()};
 $("#fc").onclick=f;$("#fc").onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f()}};
 $("#pv").onclick=()=>{ci=(ci-1+deck.length)%deck.length;flip=false;cards()};
 $("#nx").onclick=()=>{ci=(ci+1)%deck.length;flip=false;cards()};
 $("#shuf").onclick=()=>cards(true);
}
let qs=[],qi=0,sc=0,ans=false;
function quiz(reset){
 if(reset){qs=sh(flt(Q));qi=0;sc=0;ans=false}
 const el=$("#quiz");
 if(qi>=qs.length){const p=Math.round(sc/qs.length*100);
  el.innerHTML=`<div class="card" style="text-align:center"><div class="big">${sc} / ${qs.length}</div><p>${p>=80?"Excellent! You are ready.":p>=50?"Good. Review the notes you missed, then retry.":"Go through the Notes and Flashcards again, then retry."}</p><div class="ar" style="text-align:center">${p>=80?"ممتاز! جاهزة بإذن الله":"راجعي الملاحظات وأعيدي المحاولة، تقدرين!"}</div><button class="on" id="rs">Try again</button></div>`;
  $("#rs").onclick=()=>quiz(true);return}
 const q=qs[qi];
 el.innerHTML=`<div class="row"><span class="tag">Question ${qi+1} / ${qs.length} · Lecture ${q[0]}</span><span class="tag">Score: ${sc}</span></div><div class="bar"><i style="width:${qi/qs.length*100}%"></i></div>
 <div class="card"><b>${esc(q[1])}</b>${q[2].map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}<div id="fb" class="ar" hidden></div></div><div class="row"><span></span><button id="nq" hidden class="on">${qi+1==qs.length?"See score":"Next question"}</button></div>`;
 ans=false;
 $$(".opt").forEach(b=>b.onclick=()=>{if(ans)return;ans=true;const i=+b.dataset.i;
  $$(".opt").forEach((x,k)=>{if(k==q[3])x.classList.add("ok")});
  if(i==q[3])sc++;else b.classList.add("no");
  const fb=$("#fb");fb.textContent=(i==q[3]?"صح! ":"غلط. ")+q[4];fb.hidden=false;$("#nq").hidden=false});
 $("#nq").onclick=()=>{qi++;quiz()};
}
function show(){
 ["notes","cards","quiz"].forEach(t=>$("#"+t).hidden=t!=tab);
 if(tab=="notes")notes();else if(tab=="cards")cards(true);else quiz(true);
}
$$(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;$$(".tabs button").forEach(x=>x.classList.toggle("on",x==b));show()});
$$("#lecSeg button").forEach(b=>b.onclick=()=>{lec=b.dataset.l;$$("#lecSeg button").forEach(x=>x.classList.toggle("on",x==b));show()});
show();
</script></body></html>
